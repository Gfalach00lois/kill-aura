name: KillAura bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Mod bauen
        run: gradle build --no-daemon --stacktrace

      - name: JAR als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: KillAura-1.21.11
          path: build/libs/KillAura-1.21.11.jar

      - name: JAR als Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KillAura 1.21.11 (Build ${{ github.run_number }})
          files: build/libs/KillAura-1.21.11.jar
